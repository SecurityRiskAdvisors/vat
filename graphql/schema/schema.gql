input CreateTestCaseAndTemplateMatchByNameInput {
  db: String!
  campaignId: String!
  createTestCaseInputs: [CreateTestCaseDataWithTemplateNameInput!]!

  """
  When true, suppresses the automatic timeline events that would otherwise be created for
  status/outcome fields set on any test case in this request. So InProgress/Completed no
  longer auto-creates attackStart/attackStop events, and a non-TBD outcome no longer
  auto-creates a detectionTime event. Applies to every test case in this request.
  Defaults to false when omitted.
  """
  suppressAutoTimelineEvents: Boolean
}

input CreateTestCaseDataInput {
  """
  Correlation token, used to match this item to its result in the payload's
  testCaseCreateItems list. Optional - if omitted (or empty), the server generates one and
  returns it on the corresponding TestCaseCreateItem. If supplied, must be unique within the
  request.
  """
  clientId: String
  name: String!

  """
  redTeam.variant
  """
  description: String!

  """
  redTeam.objective
  """
  phase: String!
  technique: String!
  tags: [String!]
  organization: String!
  status: TestCaseStatus

  """
  campaign: String
  assessment: String
  """
  targets: [String!]
  sources: [String!]

  """
  Blue team
  """
  defenses: [String!]
  detectionSteps: [String!]
  preventionSteps: [String!]
  outcomePath: String
  overrideOutcome: Boolean
  outcomeNotes: String
  detectionTime: Float

  """
  For legacy outcomes only
  """
  detectingDefenseTools: [DefenseToolInput!]
  defenseToolOutcomes: [DefenseToolOutcomeInput!]

  """
  Red team
  """
  references: [String!]
  redTools: [RedToolInput!]
  operatorGuidance: String

  """
  redTeam.command
  """
  attackStart: Float
  attackStop: Float
  redTeamMetadata: [MetadataKeyValuePairInput!]
  blueTeamMetadata: [MetadataKeyValuePairInput!]
  attackAutomation: AttackAutomationInput
  dataVer: Int

  """
  Free-form field describing the user or execution context for this test case (e.g. a domain account, cloud IAM role, or malware privilege stage). Max 255 characters.
  """
  userContext: String
  attackSuccess: AttackSuccessState
}

