enum TimelineDesignation {
  ATTACK_START
  ATTACK_STOP
  DETECTION_TIME
  COMPLETE_TIME
}

type TimelineEvent {
  id: String
  team: String
  fieldName: String
  fieldAction: String
  type: String
  manualDescription: String
  createdByUser: AppUser
  lastUpdatedByUser: AppUser
  createTime: Float
  updateTime: Float
  toolOutcomeChange: DefenseToolOutcome

  """
  This is set if this timeline event is the attackStart/attackStop/detectionTime/completeTime
  event for the Test Case specified. Null if this event isn't the current pointer for any of
  those fields
  """
  designation: TimelineDesignation
}

type TimelineEventBatchSummary {
  total: Int!
  succeeded: Int!
  failed: Int!
}

type TimelineEventCreateItem {
  clientId: String!
  timelineEvent: TimelineEvent
  errors: [TimelineEventInsertError!]

  """
  Populated only when this item's designation caused the test case's FK to repoint away
  from a previously-assigned event. That prior event is left in place, just no longer
  referenced by this designation.
  """
  replacedTimelineEventId: String
}

enum TimelineEventErrorCode {
  TEST_CASE_NOT_FOUND
  TOOL_NOT_FOUND
  INVALID_OUTCOME_ID
  INVALID_TEAM
  INVALID_TYPE
  MISSING_EVENT_VARIANT
  CONFLICTING_OUTCOME_IDS
  DUPLICATE_IN_BATCH
  VALIDATION_ERROR
  DUPLICATE_DESIGNATION_IN_BATCH
  INVALID_TEAM_FOR_DESIGNATION
  INVALID_TIME_ORDER
  INVALID_TEAM_FOR_STATUS_CHANGE
}

input TimelineEventInput {
  """
  Correlation token, used to match this item to its result in the payload. Optional - if
  omitted (or empty), the server generates one and returns it on the corresponding
  TimelineEventCreateItem. If supplied, must be unique within the request.
  """
  clientId: String
  testCaseId: String!
  team: String
  description: String
  type: String!
  createTime: DateTime!
  manualEvent: ManualTimelineEventInput
  outcomeChange: OutcomeChangeEventInput
  toolOutcomeChange: ToolOutcomeChangeEventInput
  statusChange: StatusChangeEventInput

  """
  Exactly one of manualEvent, statusChange, or (outcomeChange and/or toolOutcomeChange) is
  required. outcomeChange and toolOutcomeChange may both be set on the same event to record a
  tool outcome change that also updates the test case's own outcome. In that case, their
  outcomeId values must match, since they represent a single outcome value attributed to both
  the test case and the tool. This occurs in the UI when a user sets a tool outcome to something
  like Alerted - High when the Test Case has no outcome. That action will also set the Test
  Case outcome to Alerted - High.
  Optional: tags this event as the test case's attackStart/attackStop/detectionTime/completeTime
  event. Restricted by team (ATTACK_START/ATTACK_STOP require Red, DETECTION_TIME requires
  Blue, COMPLETE_TIME requires Blue or Neutral) and at most one event per testCaseId per
  designation is allowed per request. If the test case already has a different event assigned
  to this designation, this takes precedence and the old event is left in place as a plain
  timeline event and no longer referenced by a designation.
  """
  designation: TimelineDesignation
}

type TimelineEventInsertError {
  code: TimelineEventErrorCode!
  field: String
  message: String!
}

type TimelineEventMutations {
  """
  Bulk-inserts TimelineEvents linked to ENV Test Cases. Every event is validated first;
  only valid events are inserted, in one transaction. Invalid events are reported per-item
  in the response rather than failing the whole request. Max 1000 events per call.
  """
  create(input: CreateTimelineEventsInput!): CreateTimelineEventsPayload
}

