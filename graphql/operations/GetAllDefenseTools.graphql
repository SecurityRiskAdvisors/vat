query GetAllDefenseTools($db: String!) {
  bluetools(db: $db) {
    nodes {
      id
      name
      description
      active
      defensiveLayers {
        id
        name
      }
      defenseToolProduct {
        id
        name
        ref
        description
        icon
        defensiveLayers {
          id
          name
          description
        }
        vendor {
          name
        }
      }
      createTime
      updateTime
    }
  }
}
